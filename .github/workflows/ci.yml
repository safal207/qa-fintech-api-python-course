name: Course CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with Allure results
        run: pytest --alluredir=allure-results

      - name: Build all course content bundles
        run: |
          python -m tools.content_factory.build_all \
            --modules-dir content/modules \
            --output generated/course-content

      - name: Upload course content bundles
        uses: actions/upload-artifact@v4
        with:
          name: course-content-bundles
          path: generated/course-content
          if-no-files-found: error

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
